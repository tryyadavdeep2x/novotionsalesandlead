name: Novotion Multi-Platform CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend Cloud Functions'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy Web Frontend & Update Server'
        type: boolean
        default: true
      build_desktop:
        description: 'Build & Release Windows Desktop App'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  # ============================================================================
  # JOB 1: Backend Deployment (Firebase Cloud Functions)
  # ============================================================================
  deploy-backend:
    name: Deploy Backend (Firebase Functions)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.deploy_backend != false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: functions/package.json

      - name: Install Functions Dependencies
        working-directory: functions
        run: |
          npm install

      - name: Generate Prisma Client & Build Functions
        working-directory: functions
        run: |
          npx prisma generate
          npm run build

      - name: Deploy to Firebase Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN || vars.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is empty. Please add FIREBASE_TOKEN in GitHub Repository Secrets."
            exit 1
          fi
          echo "Deploying Cloud Functions to project novotionsalesandlead..."
          npx firebase-tools deploy --only functions --project novotionsalesandlead --token "$FIREBASE_TOKEN" --non-interactive

  # ============================================================================
  # JOB 2: Windows Desktop Build & Release
  # ============================================================================
  build-desktop:
    name: Build Windows Desktop App
    runs-on: windows-latest
    if: github.event_name == 'push' || inputs.build_desktop != false
    outputs:
      app_version: ${{ steps.package_version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Read App Version
        id: package_version
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw -Path package.json | ConvertFrom-Json
          Write-Output "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          Write-Host "App version identified: $($pkg.version)"

      - name: Install Dependencies
        shell: pwsh
        run: |
          npm install
          npm install --prefix frontend

      - name: Build Web Frontend Bundle
        shell: pwsh
        run: |
          npm run build:frontend

      - name: Package Windows App & Generate Update Metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Package NSIS installer and generate latest.yml + blockmap
          npx electron-builder --win nsis

      - name: Stage Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          Copy-Item -Path "release/*.exe" -Destination "release-assets/" -Force
          Copy-Item -Path "release/latest.yml" -Destination "release-assets/" -Force
          Copy-Item -Path "release/*.blockmap" -Destination "release-assets/" -Force
          Get-ChildItem -Path release-assets

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets/
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.package_version.outputs.version }}
          name: Novotion Desktop Release v${{ steps.package_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/latest.yml
            release-assets/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # JOB 3: Web Frontend & Auto-Update Server Deployment (Firebase Hosting)
  # ============================================================================
  deploy-frontend:
    name: Deploy Web Frontend & Auto-Update Server
    runs-on: ubuntu-latest
    needs: [build-desktop]
    if: always() && (needs.build-desktop.result == 'success' || needs.build-desktop.result == 'skipped') && (github.event_name == 'push' || inputs.deploy_frontend != false)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install

      - name: Build Web Frontend Production Bundle
        working-directory: frontend
        run: |
          npm run build

      - name: Create Public Releases Directory
        run: |
          mkdir -p frontend/dist/releases

      - name: Download Windows Release Assets
        if: needs.build-desktop.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: frontend/dist/releases/

      - name: Generate Desktop Download Landing Page
        run: |
          cat << 'EOF' > frontend/dist/releases/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Download Novotion Sales & Lead Portal for Windows</title>
            <style>
              body {
                background: #090d16;
                color: #f1f5f9;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
              }
              .card {
                background: rgba(15, 23, 42, 0.8);
                border: 1px solid rgba(59, 130, 246, 0.2);
                border-radius: 20px;
                padding: 40px;
                max-width: 500px;
                width: 100%;
                text-align: center;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
              }
              h1 { font-size: 24px; margin-bottom: 8px; color: #ffffff; }
              p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
              .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                background: linear-gradient(135deg, #2563eb, #4f46e5);
                color: #ffffff;
                text-decoration: none;
                font-weight: 600;
                font-size: 15px;
                padding: 14px 28px;
                border-radius: 12px;
                transition: transform 0.2s, box-shadow 0.2s;
              }
              .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
              }
              .meta { margin-top: 24px; font-size: 12px; color: #64748b; }
              code { background: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Novotion Desktop for Windows</h1>
              <p>Download the official desktop application for Novotion Sales & Lead Portal. Includes native performance, direct API connectivity, and automated background updates.</p>
              <a href="latest.yml" id="downloadBtn" class="btn">
                <span>Download Windows Installer (.exe)</span>
              </a>
              <div class="meta">
                <span>Requires Windows 10/11 (64-bit)</span>
              </div>
            </div>
            <script>
              fetch('latest.yml')
                .then(r => r.text())
                .then(text => {
                  const match = text.match(/path:\s*([^\r\n]+)/);
                  if (match && match[1]) {
                    const filename = match[1].trim();
                    const btn = document.getElementById('downloadBtn');
                    btn.href = filename;
                    btn.innerHTML = 'Download ' + filename;
                  }
                })
                .catch(() => {});
            </script>
          </body>
          </html>
          EOF

      - name: Inspect Staged Hosting Assets
        run: |
          ls -la frontend/dist
          if [ -d "frontend/dist/releases" ]; then
            ls -la frontend/dist/releases
          fi

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN || vars.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is empty. Please add FIREBASE_TOKEN in GitHub Repository Secrets."
            exit 1
          fi
          echo "Deploying Web Frontend and /releases/ to project novotionsalesandlead..."
          npx firebase-tools deploy --only hosting --project novotionsalesandlead --token "$FIREBASE_TOKEN" --non-interactive
